name: Deploy OCI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "solutions/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-oci.yml"

concurrency:
  group: deploy-oci-development
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  OCI_REGION: ${{ vars.OCI_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Enable ARM64 builds
        uses: docker/setup-qemu-action@v3

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API as an OCI archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          tags: localhost/ai-prototype-api:${{ env.IMAGE_TAG }}
          outputs: type=oci,name=localhost/ai-prototype-api:${{ env.IMAGE_TAG }},dest=/tmp/api.oci

      - name: Build portal as an OCI archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          platforms: linux/arm64
          tags: localhost/ai-prototype-portal:${{ env.IMAGE_TAG }}
          outputs: type=oci,name=localhost/ai-prototype-portal:${{ env.IMAGE_TAG }},dest=/tmp/portal.oci

      - name: Install OCI CLI
        run: python -m pip install --disable-pip-version-check oci-cli

      - name: Configure OCI API signing key
        shell: bash
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_API_KEY_FINGERPRINT: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          install -d -m 0700 "$HOME/.oci"
          printf '%s' "$OCI_API_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 0600 "$HOME/.oci/oci_api_key.pem"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER_OCID"
            printf 'fingerprint=%s\n' "$OCI_API_KEY_FINGERPRINT"
            printf 'tenancy=%s\n' "$OCI_TENANCY_OCID"
            printf 'region=%s\n' "$OCI_REGION"
            printf 'key_file=%s/.oci/oci_api_key.pem\n' "$HOME"
          } > "$HOME/.oci/config"
          chmod 0600 "$HOME/.oci/config"

      - name: Upload immutable archives to Object Storage
        shell: bash
        run: |
          oci os object put \
            --bucket-name "${{ vars.OCI_ARTIFACT_BUCKET }}" \
            --name "deployments/$IMAGE_TAG/api.oci" \
            --file /tmp/api.oci \
            --force
          oci os object put \
            --bucket-name "${{ vars.OCI_ARTIFACT_BUCKET }}" \
            --name "deployments/$IMAGE_TAG/portal.oci" \
            --file /tmp/portal.oci \
            --force

      - name: Deploy immutable images through OCI Run Command
        shell: bash
        env:
          OCI_INSTANCE_OCID: ${{ vars.OCI_INSTANCE_OCID }}
        run: |
          printf '%s\n' '#!/bin/bash' \
            "sudo /opt/ai-prototype/deploy.sh '$IMAGE_TAG'" > /tmp/deploy.sh
          jq -n --rawfile script /tmp/deploy.sh \
            '{source:{sourceType:"TEXT",text:$script},output:{outputType:"TEXT"}}' \
            > /tmp/content.json

          command_id=$(oci instance-agent command create \
            --compartment-id "${{ vars.OCI_COMPARTMENT_OCID }}" \
            --target '{"instanceId":"'"$OCI_INSTANCE_OCID"'"}' \
            --content file:///tmp/content.json \
            --timeout-in-seconds 1200 \
            --query 'data.id' \
            --raw-output)

          for attempt in $(seq 1 60); do
            state=$(oci instance-agent command-execution get \
              --command-id "$command_id" \
              --instance-id "$OCI_INSTANCE_OCID" \
              --query 'data."lifecycle-state"' \
              --raw-output)

            case "$state" in
              SUCCEEDED)
                echo "Deployment completed: $command_id"
                exit 0
                ;;
              FAILED|CANCELED|TIMED_OUT|CANCELING)
                echo "Deployment failed with state $state: $command_id" >&2
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment did not finish before the workflow timeout: $command_id" >&2
          exit 1
